# https://taskfile.dev
version: '3'

vars:
  BINARY: rer
  FEED_URL: 'https://www.cbr.ru/scripts/XML_daily.asp'
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    desc: 'List available tasks'
    cmds:
      - 'task --list'
    silent: true

  build:
    desc: 'Build the binary'
    cmds:
      - 'go build -ldflags "-X main.version={{.VERSION}}" -o {{.BINARY}} ./cmd/rer'
    sources:
      - 'cmd/rer/*.go'
      - 'go.mod'
      - 'go.sum'
    generates:
      - '{{.BINARY}}'

  run:
    desc: 'Run the program (e.g. task run -- -a 100 -c EUR)'
    cmds:
      - 'go run ./cmd/rer {{.CLI_ARGS}}'

  feed:
    desc: 'Pretty-print the raw CBR XML feed (decoded to UTF-8)'
    cmds:
      - 'curl -s {{.FEED_URL}} | xmllint --format --encode UTF-8 - | bat --style=-numbers --no-paging'

  test:
    desc: 'Run tests with the race detector'
    cmds:
      - 'go test -race ./...'

  e2e:
    desc: 'Manually e2e-test the binary against live CBR data'
    cmds:
      - 'scripts/e2e.sh'

  lint:
    desc: 'Run golangci-lint'
    cmds:
      - 'golangci-lint run'

  fmt:
    desc: 'Format the code'
    cmds:
      - 'go fmt ./...'

  vet:
    desc: 'Run go vet'
    cmds:
      - 'go vet ./...'

  tidy:
    desc: 'Tidy go.mod and go.sum'
    cmds:
      - 'go mod tidy'

  ci:
    desc: 'Run the same checks as CI (build, test, lint)'
    cmds:
      - 'go build ./...'
      - task: 'test'
      - task: 'lint'

  release-snapshot:
    desc: 'Build a local release snapshot with GoReleaser (no publish)'
    cmds:
      - 'go run github.com/goreleaser/goreleaser/v2@latest release --snapshot --clean'

  clean:
    desc: 'Remove build artifacts'
    cmds:
      - 'rm -f {{.BINARY}}'
      - 'rm -rf dist'
